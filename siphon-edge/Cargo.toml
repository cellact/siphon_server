[package]
name = "siphon-edge"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
publish = false
description = "SIPhon composing binary with the HTTP addon and the in-process WebRTC peer"

[[bin]]
name = "siphon"
path = "src/main.rs"

[dependencies]
# Same git spec siphon-http uses, byte for byte. A rev or a siphon-rtp-proto
# pin here does not apply to siphon-http's copy, and cargo then fails the
# resolve. main is 1.15.7 and it requires siphon-rtp-proto ^0.15.5.
siphon-sip = { git = "https://github.com/siphon-project/siphon-sip", branch = "main" }
siphon-http = { git = "https://github.com/siphon-project/siphon-http", tag = "v1.1.0" }
clap = { version = "4", features = ["derive"] }
# Match siphon-sip 1.13. One links = "python" in the final binary.
pyo3 = { version = "0.29", features = ["py-clone"] }
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }
serde_json = "1"
tokio = { version = "1.50", features = ["full"] }
tracing = "0.1"
str0m = "0.24.1"
opus = "0.3"
hmac = "0.12"
sha1 = "0.10"
md5_turn = { package = "md-5", version = "0.10" }

[workspace]
